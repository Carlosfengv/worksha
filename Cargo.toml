[workspace]
members = ["src-tauri", "crates/local-agent-core", "crates/local-agent-service"]
resolver = "3"

[workspace.package]
version = "0.1.8"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }

# Keep line backtraces while keeping the debug credential helper below its
# existing 128 MiB limit.
[profile.dev.package.local-agent-core]
debug = 1
opt-level = 1

[profile.dev.package.local-agent-service]
debug = 1
opt-level = "s"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
