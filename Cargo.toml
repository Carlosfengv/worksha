[workspace]
members = ["src-tauri", "crates/local-agent-core", "crates/local-agent-service"]
resolver = "3"

[workspace.package]
version = "0.1.8"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }

# Keep line backtraces in the debug sidecar and core while keeping the credential
# helper below its existing 128 MiB limit. Dependency debugging remains unchanged.
[profile.dev.package.local-agent-core]
debug = 1
opt-level = 1

[profile.dev.package.local-agent-service]
debug = 1
opt-level = 1

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
