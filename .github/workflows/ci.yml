name: macOS checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      LOCAL_AGENT_TEST_SERVICE_BINARY: ${{ github.workspace }}/target/debug/local-agent-service
      PLUGIN_TEST_REPORT: .work/ci/plugins.json
      PLUGIN_M5_REPORT: .work/ci/plugin-extensions.json
      PLUGIN_RECOVERY_REPORT: .work/ci/plugin-recovery.json
      MCP_LIFECYCLE_REPORT: .work/ci/mcp-lifecycle.json
      MODEL_SERVICE_OPERATIONS_REPORT: .work/ci/model-service-operations.json
      PROVIDER_OPERATIONS_REPORT: .work/ci/provider-operations.json
      NATIVE_IMPORT_REPORT: .work/ci/native-import-operations.json
      ROUTING_BINDING_ATOMICITY_REPORT: .work/ci/routing-binding-atomicity.json
      LOCAL_TOKEN_REPORT: .work/ci/local-token-operations.json
      LOCAL_TOKEN_CANCELLATION_REPORT: .work/ci/local-token-cancellation.json
      SETTINGS_SCOPE_REPORT: .work/ci/settings-scope.json
      CREDENTIAL_RECOVERY_REPORT: .work/ci/credential-recovery.json
      CREDENTIAL_DISCOVERY_REPORT: .work/ci/credential-discovery.json
      COMPATIBILITY_CREDENTIAL_REPORT: .work/ci/compatibility-credentials.json
      LEGACY_CREDENTIAL_ADMISSION_REPORT: .work/ci/legacy-credential-admission.json
      LEGACY_WRITE_ADMISSION_REPORT: .work/ci/legacy-write-admission.json
      LEGACY_CREDENTIAL_RECOVERY_REPORT: .work/ci/legacy-credential-recovery.json
      LAN_OPERATIONS_REPORT: .work/ci/lan-operations.json
      READ_ADMISSION_REPORT: .work/ci/read-admission.json
      RETENTION_PREVIEW_REPORT: .work/ci/retention-preview.json
    steps:
      # Resolved from the existing upstream version refs on 2026-10-27.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@3da603d4464771f1a8c3dd4acb41f03bc8107551 # 1.92.0
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: mkdir -p .work/ci
      - run: pnpm install --frozen-lockfile
      - run: pnpm prepare:service
      - run: pnpm check
      - run: pnpm test:display
      - run: pnpm test:cleanup-test-apps
      - run: pnpm exec playwright install chromium
      - run: pnpm test:frontend 2>&1 | tee .work/ci/frontend.log
      - run: pnpm check:rust
      - run: pnpm test:rust
      - run: pnpm test:management-admission 2>&1 | tee .work/ci/management-admission.log
      - run: pnpm test:read-admission 2>&1 | tee .work/ci/read-admission.log
      - run: pnpm test:service 2>&1 | tee .work/ci/service.log
      - run: pnpm test:antigravity
      - run: pnpm test:observation
      - run: pnpm test:projects
      - run: pnpm test:providers
      - run: pnpm test:accounts
      - run: pnpm test:requests 2>&1 | tee .work/ci/requests.log
      - name: Provider connection and routing smoke
        run: |
          node scripts/test-credential-operations.mjs 2>&1 | tee .work/ci/credential-operations.log
          pnpm test:credential-recovery 2>&1 | tee .work/ci/credential-recovery.log
          pnpm test:credential-discovery 2>&1 | tee .work/ci/credential-discovery.log
          pnpm test:compatibility-credentials 2>&1 | tee .work/ci/compatibility-credentials.log
          pnpm test:legacy-credential-admission 2>&1 | tee .work/ci/legacy-credential-admission.log
          pnpm test:legacy-write-admission 2>&1 | tee .work/ci/legacy-write-admission.log
          pnpm test:legacy-credential-recovery 2>&1 | tee .work/ci/legacy-credential-recovery.log
          node scripts/test-provider-auto-connect.mjs 2>&1 | tee .work/ci/provider-auto-connect.log
          pnpm test:provider-operations 2>&1 | tee .work/ci/provider-operations.log
          pnpm test:native-import-operations 2>&1 | tee .work/ci/native-import-operations.log
          pnpm test:routing-binding-atomicity 2>&1 | tee .work/ci/routing-binding-atomicity.log
          pnpm test:local-token-operations 2>&1 | tee .work/ci/local-token-operations.log
          pnpm test:local-token-cancellation 2>&1 | tee .work/ci/local-token-cancellation.log
          node scripts/test-model-services.mjs 2>&1 | tee .work/ci/model-services.log
          pnpm test:model-service-operations 2>&1 | tee .work/ci/model-service-operations.log
          pnpm test:settings-scope 2>&1 | tee .work/ci/settings-scope.log
          pnpm test:retention-preview 2>&1 | tee .work/ci/retention-preview.log
          pnpm test:lan-operations 2>&1 | tee .work/ci/lan-operations.log
          node scripts/test-dynamic-routing.mjs 2>&1 | tee .work/ci/dynamic-routing.log
          node scripts/test-routing-policy.mjs 2>&1 | tee .work/ci/routing-policy.log
      - name: Plugin isolation and recovery smoke
        run: |
          pnpm prepare:plugins 2>&1 | tee .work/ci/plugin-prepare.log
          pnpm test:plugins 2>&1 | tee .work/ci/plugins.log
          pnpm test:plugin-extensions 2>&1 | tee .work/ci/plugin-extensions.log
          pnpm test:protocol-completion 2>&1 | tee .work/ci/protocol-completion.log
          pnpm test:plugin-recovery 2>&1 | tee .work/ci/plugin-recovery.log
          pnpm test:plugin-records 2>&1 | tee .work/ci/plugin-records.log
          pnpm test:plugin-config-lifecycle 2>&1 | tee .work/ci/plugin-config-lifecycle.log
          pnpm test:mcp-lifecycle 2>&1 | tee .work/ci/mcp-lifecycle.log
      - run: pnpm build
      - run: pnpm tauri build --debug --bundles app
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-failure-evidence
          path: |
            .work/test-results/
            .work/ci/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
