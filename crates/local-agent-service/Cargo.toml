[package]
name = "local-agent-service"
version.workspace = true
edition.workspace = true

[dependencies]
local-agent-core = { path = "../local-agent-core" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync", "process", "io-util"] }
serde_json.workspace = true
serde.workspace = true
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
http-body = "1"
async-stream = "0.3"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
url = "2"
zeroize = "1"
wasmtime = { version = "=36.0.19", default-features = false, features = ["std", "runtime", "cranelift", "component-model"] }
zip = { version = "=9.0.5", default-features = false, features = ["deflate"] }
ed25519-dalek = "=3.0.0"
sha2 = "0.10"
semver = "1"
rusqlite = { version = "=0.39.0", features = ["bundled"] }
libc = "0.2"
wit-component = "=0.236.1"
tokenizers = { version = "=0.23.2", default-features = false, features = ["fancy-regex"] }

[dev-dependencies]
tempfile = "3"
